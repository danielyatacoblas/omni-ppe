<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1180" viewBox="0 0 2000 1180" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, sans-serif"><title id="t">OMNI PPE · de la cámara de la obra a «puede entrar»</title><desc id="d">Un solo modelo y una regla de reparto. Las cifras de velocidad están medidas en esta máquina; las de acierto vienen de la validación con la que se entrenó cada modelo.</desc><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.14"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L0,9 L8,4.5 z" fill="#334155"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><text x="48" y="52" font-size="30" font-weight="700" fill="#0f172a" text-anchor="start">OMNI PPE · de la cámara de la obra a «puede entrar»</text><text x="48" y="82" font-size="14" font-weight="400" fill="#475569" text-anchor="start">Un solo modelo y una regla de reparto. Las cifras de velocidad están medidas en esta máquina; las de acierto vienen de</text><text x="48" y="102" font-size="14" font-weight="400" fill="#475569" text-anchor="start">la validación con la que se entrenó cada modelo.</text><rect x="60" y="150" width="360" height="900" rx="18" fill="#e2e8f0" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5"/><text x="76" y="178" font-size="13" font-weight="700" fill="#334155" text-anchor="start">ENTRADA</text><text x="76" y="196" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">La cámara de la puerta</text><rect x="460" y="150" width="360" height="900" rx="18" fill="#dbeafe" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5"/><text x="476" y="178" font-size="13" font-weight="700" fill="#334155" text-anchor="start">DETECCIÓN</text><text x="476" y="196" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">Personas e ítems de EPP</text><rect x="860" y="150" width="340" height="900" rx="18" fill="#ede9fe" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5"/><text x="876" y="178" font-size="13" font-weight="700" fill="#334155" text-anchor="start">REPARTO</text><text x="876" y="196" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">De quién es cada ítem</text><rect x="1240" y="150" width="340" height="900" rx="18" fill="#dcfce7" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5"/><text x="1256" y="178" font-size="13" font-weight="700" fill="#334155" text-anchor="start">PUNTUACIÓN</text><text x="1256" y="196" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">Cuánto cumple</text><rect x="1620" y="150" width="320" height="900" rx="18" fill="#fef3c7" fill-opacity="0.5" stroke="#94a3b8" stroke-width="1.5"/><text x="1636" y="178" font-size="13" font-weight="700" fill="#334155" text-anchor="start">DECISIÓN</text><text x="1636" y="196" font-size="10.5" font-weight="400" fill="#64748b" text-anchor="start">Puede entrar o no</text><path d="M 400 330 H 440.0 V 330 H 480" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><text x="440.0" y="320" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">fotogramas</text><path d="M 400 700 V 1010 H 1390 V 960" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><text x="830.0" y="1002" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">el requisito de EPP entra en la puntuación, no en el detector</text><path d="M 800 330 H 840.0 V 400 H 880" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><text x="840.0" y="320" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">cajas</text><path d="M 800 660 H 1030.0 V 880 H 1260" fill="none" stroke="#334155" stroke-width="2.2" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="1030.0" y="650" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">geometría</text><path d="M 1180 400 H 1220.0 V 400 H 1260" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><text x="1220.0" y="390" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" stroke="#ffffff" stroke-width="5" paint-order="stroke">por persona</text><path d="M 1560 400 H 1600.0 V 330 H 1640" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M 1560 700 H 1600.0 V 560 H 1640" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><path d="M 1560 880 H 1600.0 V 790 H 1640" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="80" y="250" width="320" height="175" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="96" y="262" width="69.6" height="20" rx="10" fill="#e2e8f0"/><text x="130.8" y="276" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">EXISTENTE</text><text x="96" y="304" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Cámara de acceso a obra</text><text x="96" y="329" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Un .mp4 de la cámara de siempre.</text><text x="96" y="345" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Hoy esto lo hace un vigilante</text><text x="96" y="361" font-size="11" font-weight="400" fill="#475569" text-anchor="start">mirando, con veinte entrando.</text><rect x="80" y="560" width="320" height="190" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="96" y="572" width="88.80000000000001" height="20" rx="10" fill="#dbeafe"/><text x="140.4" y="586" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">CONFIGURABLE</text><text x="96" y="614" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Qué EPP se exige</text><text x="96" y="639" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Casco y chaleco por defecto.</text><text x="96" y="655" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Se cambia en el .env, sin tocar</text><text x="96" y="671" font-size="11" font-weight="400" fill="#475569" text-anchor="start">código: cada obra tiene su</text><text x="96" y="687" font-size="11" font-weight="400" fill="#475569" text-anchor="start">propio requisito.</text><rect x="480" y="240" width="320" height="250" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="496" y="252" width="63.2" height="20" rx="10" fill="#dcfce7"/><text x="527.6" y="266" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">DETECTOR</text><text x="496" y="294" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">SH17 yolo9e · 17 clases</text><text x="496" y="319" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Personas e ítems en el mismo</text><text x="496" y="335" font-size="11" font-weight="400" fill="#475569" text-anchor="start">pase. Licencia CC BY-NC-SA:</text><text x="496" y="351" font-size="11" font-weight="400" fill="#475569" text-anchor="start">no comercial.</text><line x1="496" y1="359" x2="784" y2="359" stroke="#e2e8f0" stroke-width="1.5"/><text x="496" y="375" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">mAP@50</text><text x="784" y="375" font-size="12" font-weight="700" fill="#166534" text-anchor="end">70.9 %</text><text x="496" y="394" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">mAP@50-95</text><text x="784" y="394" font-size="12" font-weight="700" fill="#166534" text-anchor="end">48.6 %</text><text x="496" y="413" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">precisión</text><text x="784" y="413" font-size="12" font-weight="700" fill="#166534" text-anchor="end">81.2 %</text><text x="496" y="432" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">velocidad medida</text><text x="784" y="432" font-size="12" font-weight="700" fill="#1e40af" text-anchor="end">7.9 fps</text><rect x="480" y="580" width="320" height="230" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="496" y="592" width="63.2" height="20" rx="10" fill="#fef3c7"/><text x="527.6" y="606" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">OPCIONAL</text><text x="496" y="634" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">SH17 yolo8m · alternativa</text><text x="496" y="659" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Más rápida, algo menos precisa.</text><text x="496" y="675" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Se cambia con una variable, sin</text><text x="496" y="691" font-size="11" font-weight="400" fill="#475569" text-anchor="start">tocar una línea de código.</text><line x1="496" y1="699" x2="784" y2="699" stroke="#e2e8f0" stroke-width="1.5"/><text x="496" y="715" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">mAP@50</text><text x="784" y="715" font-size="12" font-weight="700" fill="#166534" text-anchor="end">66.5 %</text><text x="496" y="734" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">velocidad medida</text><text x="784" y="734" font-size="12" font-weight="700" fill="#1e40af" text-anchor="end">19.0 fps</text><text x="496" y="753" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">frente a yolo9e</text><text x="784" y="753" font-size="12" font-weight="700" fill="#1e40af" text-anchor="end">más veloz</text><rect x="880" y="300" width="300" height="265" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="896" y="312" width="44.0" height="20" rx="10" fill="#ede9fe"/><text x="918.0" y="326" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">REGLA</text><text x="896" y="354" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Quien más lo contiene</text><text x="896" y="379" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Cada ítem va a la persona cuya</text><text x="896" y="395" font-size="11" font-weight="400" fill="#475569" text-anchor="start">caja más lo contiene, no a la</text><text x="896" y="411" font-size="11" font-weight="400" fill="#475569" text-anchor="start">más cercana.</text><text x="896" y="427" font-size="11" font-weight="400" fill="#475569" text-anchor="start"></text><text x="896" y="443" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Y el casco se comprueba por</text><text x="896" y="459" font-size="11" font-weight="400" fill="#475569" text-anchor="start">geometría: tiene que caer sobre</text><text x="896" y="475" font-size="11" font-weight="400" fill="#475569" text-anchor="start">la cabeza.</text><line x1="896" y1="483" x2="1164" y2="483" stroke="#e2e8f0" stroke-width="1.5"/><text x="896" y="499" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">un casco en el suelo</text><text x="1164" y="499" font-size="12" font-weight="700" fill="#92400e" text-anchor="end">no cuenta</text><text x="896" y="518" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">«sin casco» explícito</text><text x="1164" y="518" font-size="12" font-weight="700" fill="#92400e" text-anchor="end">gana al flojo</text><rect x="1260" y="300" width="300" height="165" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="1276" y="326" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Suma de pesos</text><text x="1276" y="351" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Casco 0.45 + chaleco 0.45 = 0.90,</text><text x="1276" y="367" font-size="11" font-weight="400" fill="#475569" text-anchor="start">por encima del umbral 0.80.</text><line x1="1276" y1="375" x2="1544" y2="375" stroke="#e2e8f0" stroke-width="1.5"/><text x="1276" y="391" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">lentes y guantes</text><text x="1544" y="391" font-size="12" font-weight="700" fill="#166534" text-anchor="end">0.05 cada uno</text><rect x="1260" y="610" width="300" height="165" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="1276" y="636" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Umbral o modo estricto</text><text x="1276" y="661" font-size="11" font-weight="400" fill="#475569" text-anchor="start">O llega al porcentaje, o se</text><text x="1276" y="677" font-size="11" font-weight="400" fill="#475569" text-anchor="start">exigen todos los ítems.</text><line x1="1276" y1="685" x2="1544" y2="685" stroke="#e2e8f0" stroke-width="1.5"/><text x="1276" y="701" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">se elige</text><text x="1544" y="701" font-size="12" font-weight="700" fill="#166534" text-anchor="end">en el .env</text><rect x="1260" y="790" width="300" height="165" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><text x="1276" y="816" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Comprobación de cordura</text><text x="1276" y="841" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Casco + chaleco tienen que seguir</text><text x="1276" y="857" font-size="11" font-weight="400" fill="#475569" text-anchor="start">bastando aunque se toquen</text><text x="1276" y="873" font-size="11" font-weight="400" fill="#475569" text-anchor="start">los pesos.</text><line x1="1276" y1="881" x2="1544" y2="881" stroke="#e2e8f0" stroke-width="1.5"/><text x="1276" y="897" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="start">si no</text><text x="1544" y="897" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="end">nadie pasaría nunca</text><rect x="1640" y="250" width="280" height="175" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="1656" y="262" width="44.0" height="20" rx="10" fill="#dcfce7"/><text x="1678.0" y="276" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">VALOR</text><text x="1656" y="304" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">LISTO o NO LISTO</text><text x="1656" y="329" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Por persona y en vivo, con el</text><text x="1656" y="345" font-size="11" font-weight="400" fill="#475569" text-anchor="start">porcentaje a la vista.</text><rect x="1640" y="480" width="280" height="175" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="1656" y="492" width="44.0" height="20" rx="10" fill="#dcfce7"/><text x="1678.0" y="506" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">VALOR</text><text x="1656" y="534" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Qué le falta exactamente</text><text x="1656" y="559" font-size="11" font-weight="400" fill="#475569" text-anchor="start">No «no cumple», sino «le falta</text><text x="1656" y="575" font-size="11" font-weight="400" fill="#475569" text-anchor="start">el chaleco».</text><rect x="1640" y="710" width="280" height="175" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/><rect x="1656" y="722" width="44.0" height="20" rx="10" fill="#dcfce7"/><text x="1678.0" y="736" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">VALOR</text><text x="1656" y="764" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start">Registro de la puerta</text><text x="1656" y="789" font-size="11" font-weight="400" fill="#475569" text-anchor="start">Queda por escrito quién pasó</text><text x="1656" y="805" font-size="11" font-weight="400" fill="#475569" text-anchor="start">y con qué.</text><rect x="48" y="1090" width="1904" height="52" rx="12" fill="#e2e8f0"/><text x="70" y="1122" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start">Repartir por «el más cercano» le daría el casco de un operario al de al lado, y los dos saldrían aprobados llevándolo uno solo.</text></svg>